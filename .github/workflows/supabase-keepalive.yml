name: Supabase keep-alive

# Evita que o projeto Supabase (plano free) seja pausado por inatividade (7 dias).
# Roda a cada 3 dias e faz uma consulta real no banco.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar banco
        env:
          RAW_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Remove espaços/quebras de linha e aspas que possam ter vindo do .env
          DB_URL=$(printf '%s' "$RAW_URL" | tr -d '\r\n' | sed -E 's/^[[:space:]"'\'']+//; s/[[:space:]"'\'']+$//')
          if [ -z "$DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL vazio ou inexistente"; exit 1
          fi
          echo "Conectando em: $(printf '%s' "$DB_URL" | sed -E 's#(://[^:]+:)[^@]+@#\1***@#')"
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM "User";'
